name: Clinic Booking CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-coverage:
    name: Build, Test & Measure Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install Google Chrome (Headless Testing)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Build & Run Automated Test Suite (Unit, Integration, Selenium E2E & JaCoCo)
        run: mvn clean verify --batch-mode

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
