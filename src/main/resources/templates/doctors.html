<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CarePulse Clinic - Doctor Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <!-- Page Title -->
        <div class="md:flex md:items-center md:justify-between mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Doctor Directory</h1>
                <p class="mt-1 text-sm text-slate-500">Check real-time doctor availability and book appointments.</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
                    Active Patient: <strong class="ml-1" th:text="${currentPatient.name}">Patient</strong>
                </span>
            </div>
        </div>

        <!-- Alert Notifications -->
        <div th:if="${errorMessage}" id="error-alert" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-xl shadow-sm">
            <div class="flex items-center">
                <div class="flex-shrink-0 text-red-500">
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-3">
                    <p id="error-message-text" class="text-sm font-semibold text-red-800" th:text="${errorMessage}"></p>
                </div>
            </div>
        </div>

        <div th:if="${successMessage}" id="success-alert" class="mb-6 bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-xl shadow-sm">
            <div class="flex items-center">
                <div class="flex-shrink-0 text-emerald-500">
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-3">
                    <p id="success-message-text" class="text-sm font-semibold text-emerald-800" th:text="${successMessage}"></p>
                </div>
            </div>
        </div>

        <!-- Doctors Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div th:each="doctor : ${doctors}" th:id="'doctor-card-' + ${doctor.id}" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition p-6 flex flex-col justify-between">
                <div>
                    <div class="flex items-start justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900" th:text="${doctor.name}">Doctor Name</h3>
                            <span class="inline-block mt-1 text-xs text-slate-500 font-medium">Specialist Physician</span>
                        </div>
                        <div>
                            <span th:if="${doctor.isAvailable}" th:id="'status-available-' + ${doctor.id}" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Available
                            </span>
                            <span th:unless="${doctor.isAvailable}" th:id="'status-unavailable-' + ${doctor.id}" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200">
                                <span class="w-2 h-2 mr-1.5 bg-rose-500 rounded-full"></span> Unavailable
                            </span>
                        </div>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-100">
                    <form action="/doctors/book" method="post" class="space-y-4">
                        <input type="hidden" name="doctorId" th:value="${doctor.id}"/>
                        <input type="hidden" name="patientId" th:value="${currentPatient.id}"/>
                        
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Notice Period (Hours Until Appointment):</label>
                            <div class="flex items-center space-x-2">
                                <input type="number" 
                                       th:id="'hours-input-' + ${doctor.id}" 
                                       name="hoursUntilAppointment" 
                                       value="48" 
                                       min="0" 
                                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
                                <span class="text-xs text-slate-400 font-medium">hrs</span>
                            </div>
                        </div>

                        <button type="submit" 
                                th:id="'book-btn-' + ${doctor.id}" 
                                th:disabled="${!doctor.isAvailable}"
                                th:class="${doctor.isAvailable} ? 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition text-sm flex items-center justify-center' : 'w-full bg-slate-200 text-slate-400 font-bold py-2.5 px-4 rounded-xl cursor-not-allowed text-sm flex items-center justify-center'">
                            Book Appointment
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
